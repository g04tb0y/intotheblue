<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}intotheblue{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/vendor/htmx.min.js"></script>
</head>
<body>
  <header>
    <span class="brand">intotheblue</span>
    <nav>
      <a href="/">Scans</a>
      <a href="/devices">Devices</a>
      <a href="/logs">Logs</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {# Always-on tail of the structured event log (see /logs for the full history). #}
  <footer id="logtail" hx-get="/api/logs/tail" hx-trigger="load, every 3s"
          hx-swap="innerHTML">
    <span class="muted">log…</span>
  </footer>
</body>
</html>
